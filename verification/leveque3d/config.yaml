# 3D LeVeque deformation verification study.
#
# The fully three-dimensional deformation field
#   u =  2 sin^2(pi x) sin(2 pi y) sin(2 pi z)
#   v = -sin(2 pi x) sin^2(pi y) sin(2 pi z)
#   w = -sin(2 pi x) sin(2 pi y) sin^2(pi z)
# on the unit cube. Unlike the spiralling field this does not split into a
# horizontal plus an axial part, but it still has a closed-form vector
# potential (see movingFrameFlow3D), so the flux is again a discrete
# circulation rather than a quadrature repaired by a Poisson projection.
#
# NOTE ON THE MESH. The committed simulationParameter of test-Leveque carries
# nz 64 against a unit-cube domain, i.e. cells with dz = dx/2. The testsuite
# overrides it with nz = res, and so does this workflow (nz_factor 1), which is
# what the published errors correspond to.

base_field: leveque
nz_factor: 1                   # [0,1]^3 -> cubic cells
domain_height: 1

resolutions: [32, 64, 128]
schemes: [plicRDF, isoAlpha]
frames: [none, frameA]

end_time: 3
period: 6
write_interval: 1.5

# The unit cube is invariant under the base field, and the material was measured
# to stay within horizontal radius 0.46 of the axis through (0.5, 0.5), so a
# z-parallel rotation about that axis keeps it inside the cube. The margin is
# 0.04, i.e. 1.3 cells at N=32 and 5 at N=128, so watch E_mass at the coarsest
# level exactly as in the 2D study.
frame:
  rotation_centre: "(0.5 0.5 0)"
  swirl_centre: "(0.5 0.5 0)"
  revolutions: 1
  translation_amplitude: 0.0

np: 1

viz:
  N: 64
  scheme: plicRDF
  write_interval: 0.75

runs_dir: runs
results_dir: results

mpi_launcher: "mpirun -np {np}"
env_preamble: ""

field_label: "LeVeque deformation"
