# Reversed-vortex verification study.
#
# Defaults reproduce the serial protocol of the TwoPhaseFlow testsuite case
# test-vortexShearedDisc, so the "none" column reproduces its published errors.
# Override any of this on the command line with --config key=value.

resolutions: [32, 64, 128, 256, 512, 1024, 2048]
schemes: [plicRDF, isoAlpha]
frames: [none, frameA]          # "none" = original retracing test

# Base-field time control. alpha(t) = cos(2 pi t / period); end_time = period/2
# makes the integral of alpha vanish, so the exact flow map at T is the identity.
end_time: 8
period: 16
write_interval: 4               # reference protocol: writes t = 0, T/2, T

# Superposed periodic Euclidean frame (used when frame == frameA).
# The rotation centre is the domain centre: the material support is confined to
# a streamline band of radius 0.4417 about it, so the unit square suffices.
frame:
  rotation_centre: "(0.5 0 0.5)"
  revolutions: 1
  translation_amplitude: 0.0

# MPI ranks per solve. np=1 (serial) reproduces the reference numbers exactly;
# the cases themselves run concurrently, one sbatch each.
np:
  32: 1
  64: 1
  128: 2
  256: 4
  512: 8
  1024: 16
  2048: 32

# Section 4.2: the error of the frame alone (alpha = 0), checked by the
# frame_only rule.
frame_only:
  scheme: plicRDF
  resolutions: [64, 128, 256]

# Which case the interface snapshots are made from.
viz:
  N: 128
  scheme: plicRDF
  # every T/40: the quarter-period snapshots, the 0.1T evolution figure and the
  # animation frames all come from the same two runs
  write_interval: 0.2

runs_dir: runs
results_dir: results

# Overridden by the profiles; this default suits a plain workstation.
mpi_launcher: "mpirun -np {np}"
env_preamble: ""

# Section 4.2: the moving-frame code path with the frame set to the
# identity must reproduce the retracing test.  One extra run, checked
# by the frame_identity rule.
equivalence:
  N: 128
  scheme: plicRDF

# Interface Courant number. Scheufler & Roenby (2019) demonstrate second order
# convergence for plicRDF "for CFL number 0.2 and below"; Roenby et al. (2016)
# report Co in [0,1] as fairly stable with an optimum near 0.5. This is a
# convergence study, so it runs in the regime where the order being measured
# has been demonstrated. The initial time step is scaled with it too, since a
# fixed one violates the limit outright on fine meshes.
max_alpha_co: 0.2

# The time step is fixed at dt = max_alpha_co*h/u_max, with u_max the
# maximum of ||w||_1 over the domain and the period. The timestep_bound
# rule computes it from the values above into results/timestep_bound.json;
# it is never copied by hand. courant_check then reads the Courant number
# each run reached from its log.
