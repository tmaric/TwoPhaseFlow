# SLURM profile for the Lichtenberg cluster (TU Darmstadt).
#
#   snakemake --workflow-profile profiles/slurm
#
# Conventions taken from leia/CLUSTER.md:
#   * account special00004
#   * Lichtenberg's job_submit plugin REJECTS any job without --mem-per-cpu,
#     supplied here via mem_mb_per_cpu; the partition is auto-routed from the
#     runtime (deflt 24 h, deflt_short 30 min, long 7 d).
#   * the MPI launcher must be
#     `srun --ntasks={np} --overlap --cpu-bind=none --mem=0`, and every
#     solve must be confined to one node with the `nodes: 1` resource
#     (the plugin rejects --nodes inside slurm_extra).  Snakemake runs
#     each command inside its own `srun -n1` step; SLURM narrows that step
#     to a single node and reserves the node's whole memory, so a nested
#     srun is refused with "More processors requested than permitted"
#     (multi-node allocation) or "Memory required by task is not
#     available" (--mem=0 missing).  Below 16 ranks the allocation used to
#     land on one node and it worked by accident.
#     Plain mpirun fails inside snakemake's slurm-jobstep wrapper ("not enough
#     slots"), and --overlap without --cpu-bind=none confines every rank to one
#     CPU, which is silent and costs orders of magnitude.
#
# The toolchain lives in env-lichtenberg.sh rather than in an `env_preamble`
# string, because snakemake expands $VARIABLES in config values against the
# submitting environment: a preamble that sets WM_PROJECT_USER_DIR and then
# builds FOAM_USER_APPBIN from it produced "/platforms//bin".
# Resource sizing is measured, not guessed.  A standard node is 96 cores and
# 364800 MB, i.e. 3800 MB per core; asking for more than that per core makes
# the job_submit plugin re-route the job to the five-node `mem` partition,
# where 64-core jobs waited days.  Over 136 recorded jobs the peak was
# 1702 MB/cpu and the longest step 00:15:29.
executor: slurm
jobs: 60
printshellcmds: true
rerun-incomplete: true

default-resources:
  slurm_account: "special00004"
  mem_mb_per_cpu: 3600
  runtime: 240

set-resources:
  tools:
    runtime: 60
    mem_mb_per_cpu: 3600
  solve:
    runtime: 240
    mem_mb_per_cpu: 3600
    nodes: 1
  solve_viz:
    runtime: 240
    mem_mb_per_cpu: 3600
    nodes: 1
  plot_convergence:
    runtime: 30
    mem_mb_per_cpu: 3600
  visualize:
    runtime: 60
    mem_mb_per_cpu: 3600

config:
  - "mpi_launcher=srun --ntasks={np} --overlap --cpu-bind=none --mem=0"
  - "env_script=env-lichtenberg.sh"
  - "viz_env_script=env-python.sh"
