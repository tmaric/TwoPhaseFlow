# 3D shear-flow verification study (Liovic et al. 2006; the configuration
# distributed with TwoPhaseFlow, Scheufler & Roenby 2019 sect. 4.2.4).
# 'spiralling' below is the OpenFOAM dictionary keyword, not the case name.
#
# The reference case (testsuite/advection/test-deformationSphere) builds the
# flux as a face-centre quadrature and repairs it with CorrectPhi, a Poisson
# projection. Both columns here instead use movingFrameFlow3D, which assembles
# the flux as the discrete circulation of the analytic vector potential: exact,
# local, no linear solve, and discretely solenoidal by construction.

base_field: spiralling
nz_factor: 1                   # cubic cells
domain_height: 1

resolutions: [32, 64, 128, 256]
schemes: [plicRDF, isoAlpha]
frames: [none, frameA]

# alpha(t) = cos(2 pi t/period); the reference spells this "spirallingFlow 3",
# i.e. cos(pi t/3), so period = 6 and end_time = 3 = period/2.
end_time: 3
period: 6
write_interval: 1.5            # reference protocol: writes t = 0, T/2, T

frame:
  rotation_centre: "(0.5 0.5 0)"
  swirl_centre: "(0.5 0.5 0)"
  revolutions: 1
  translation_amplitude: 0.0

np:
  32: 1
  64: 4
  128: 16
  256: 64

viz:
  N: 128
  scheme: plicRDF
  write_interval: 0.75         # writes t = 0, T/4, T/2, 3T/4, T

runs_dir: runs
results_dir: results

mpi_launcher: "mpirun -np {np}"
env_preamble: ""

# named in the snapshot titles; do not rely on the script default
field_label: "3D shear flow"

# Interface Courant number. Scheufler & Roenby (2019) demonstrate second order
# convergence for plicRDF "for CFL number 0.2 and below"; Roenby et al. (2016)
# report Co in [0,1] as fairly stable with an optimum near 0.5. This is a
# convergence study, so it runs in the regime where the order being measured
# has been demonstrated. The initial time step is scaled with it too, since a
# fixed one violates the limit outright on fine meshes.
max_alpha_co: 0.2

# max||w||_1 of the laboratory field over the domain and the
# period, from scripts/timestep_bound.py. The time step is fixed at
# dt = max_alpha_co*h/u_max, so the Courant number is that value in
# every cell at every step and both columns take the same step.
u_max: 2.344226
